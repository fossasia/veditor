[project]
name = "veditor"
version = "0.1.0"
description = "VEditor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "rq>=2.11.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "av>=18.1.0",
    "pillow>=12.3.0",
    "numpy>=2.5.2",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
]

[project.scripts]
veditor = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.3",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["migrations"]
