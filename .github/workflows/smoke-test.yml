name: Smoke Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  smoke-test-native:
    name: Native Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # PostgreSQL is pre-installed on the runner, but its service is off.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Start PostgreSQL
        run: sudo systemctl start postgresql
      - name: Set up database (peer auth, like README Linux setup)
        run: |
          sudo -u postgres createuser -s "$USER"
          createdb veditor
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run API in background
        run: uv run uvicorn app.main:app &
      - name: Wait for API to be healthy
        run: timeout 30s bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
      - name: Run smoke test
        run: uv run pytest tests/test_smoke.py

  smoke-test-docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    env:
      ALLOW_SMOKE_DB_WIPE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Copy env vars
        run: cp .env.example .env
      - name: Start docker-compose stack
        run: docker compose up -d --build
      - name: Wait for API to be healthy
        run: timeout 60s bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done'
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run migrations against docker stack
        run: uv run alembic upgrade head
      - name: Run smoke test
        run: uv run pytest tests/test_smoke.py
