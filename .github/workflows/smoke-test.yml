name: Smoke Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  smoke-test-native:
    name: Native Smoke Test
    runs-on: ubuntu-latest
    env:
      ALLOW_SMOKE_DB_WIPE: "1"

    steps:
      - uses: actions/checkout@v7
      # PostgreSQL is pre-installed on the runner, but its service is off.
      # For now, GitHub provides "ubuntu-latest" with Ubuntu 24.04, its PostgreSQL is v16.
      # After November 2026, it will be Ubuntu 26.04 and come with PostgreSQL 18.
      # If this workflow is run on a self-hosted runner,
      # need to adjust the `apt-get` command to install PostgreSQL as well.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Start PostgreSQL
        # We don't need to do `systemctl start redis` because the `apt install` command
        # already triggered it.
        run: sudo systemctl start postgresql
      - name: Set up database (peer auth, like README Linux setup)
        run: |
          sudo -u postgres createuser -s "$USER"
          # POSTGRES_DB stays "veditor" (the default); tests use the derived
          # "test_veditor" database (see app/config.py: Settings.testing_db_name).
          createdb veditor
          createdb test_veditor
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen --group test
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run API in background
        run: uv run uvicorn app.main:app &
      - name: Wait for API to be healthy
        run: timeout 30s bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
      - name: Run smoke test
        run: uv run pytest tests/test_smoke.py

  smoke-test-docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    env:
      ALLOW_SMOKE_DB_WIPE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Copy env vars
        run: cp .env.example .env
      - name: Start docker-compose stack
        run: docker compose up -d --build
      - name: Wait for API to be healthy
        run: timeout 60s bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen --group test
      - name: Run migrations against docker stack
        run: uv run alembic upgrade head
      - name: Run smoke test
        run: uv run pytest tests/test_smoke.py
