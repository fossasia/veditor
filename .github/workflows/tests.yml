name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # PostgreSQL is pre-installed on the runner, but its service is off.
      # For now, GitHub provides "ubuntu-latest" with Ubuntu 24.04, its PostgreSQL is v16.
      # After November 2026, it will be Ubuntu 26.04 and come with PostgreSQL 18.
      # If this workflow is run on a self-hosted runner,
      # need to adjust the `apt-get` command to install PostgreSQL as well.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Start PostgreSQL
        # We don't need to do `systemctl start redis` because the `apt install` command
        # already triggered it.
        run: sudo systemctl start postgresql
      - name: Set up database (peer auth, like README Linux setup)
        run: |
          sudo -u postgres createuser -s "$USER"
          # POSTGRES_DB stays "veditor" (the default); tests use the derived
          # "test_veditor" database (see app/config.py: Settings.testing_db_name).
          createdb veditor
          createdb test_veditor
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen --group test
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest --ignore=tests/test_smoke.py
      # Destructive tests drop the whole test schema, so they must run alone,
      # never interleaved or parallelized with the rest of the suite.
      - name: Run destructive tests
        run: uv run pytest -m destructive -n0
