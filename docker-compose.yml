services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=veditor
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=veditor
      - REDIS_URL=redis://redis:6379/0
      - 'INGEST_ROOTS=["/app/ingest"]'
    volumes:
      - veditor_data:/app/data
      - veditor_ingest:/app/ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-light:
    build: .
    command: uv run python scripts/run_worker.py light --concurrency 2 --with-scheduler --nice 10
    environment:
      - POSTGRES_USER=veditor
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=veditor
      - REDIS_URL=redis://redis:6379/0
      - 'INGEST_ROOTS=["/app/ingest"]'
      - ENCODER_THREADS=1
    volumes:
      - veditor_data:/app/data
      - veditor_ingest:/app/ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-heavy:
    build: .
    command: uv run python scripts/run_worker.py heavy --concurrency 1 --nice 10
    environment:
      - POSTGRES_USER=veditor
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=veditor
      - REDIS_URL=redis://redis:6379/0
      - 'INGEST_ROOTS=["/app/ingest"]'
      - ENCODER_THREADS=1
    volumes:
      - veditor_data:/app/data
      - veditor_ingest:/app/ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=veditor
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=veditor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veditor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  veditor_data:
  veditor_ingest:

